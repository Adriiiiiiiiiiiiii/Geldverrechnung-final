<style>
  :root {
    --color-bg: #fafafa; --color-surface: #ffffff; --color-border: #e5e5e5;
    --color-text: #171717; --color-text-muted: #a3a3a3;
    --color-negative: #dc2626; --color-positive: #059669;
    --radius: 12px; --radius-lg: 20px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Saldo-Kopf: jetzt sticky, bleibt beim Scrollen sichtbar oben */
  .balance-header { position: sticky; top: 0; z-index: 20; background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 22px 56px 18px; text-align: center; }
  .balance-label { font-size: 14px; color: var(--color-text-muted); margin: 0 0 8px; }
  .balance-amount { font-size: 40px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .balance-amount.negative { color: var(--color-negative); }
  .balance-subtext { font-size: 12px; color: var(--color-text-muted); margin: 8px 0 0; }

  .corner-btn { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); cursor: pointer; }
  .corner-btn.active { background: #f5f5f5; color: var(--color-text); }
  .corner-btn-left { left: 16px; }
  .corner-btn-right { right: 16px; }

  .search-bar { display: flex; align-items: center; gap: 8px; max-width: 480px; margin: 12px auto 0; padding: 0 16px; }
  .search-bar input { flex: 1; border: 1px solid var(--color-border); border-radius: 10px; padding: 9px 12px; font-size: 16px; font-family: inherit; }
  .search-bar input:focus { outline: none; border-color: #a3a3a3; }
  .search-clear-btn { background: #f5f5f5; border: none; border-radius: 8px; width: 34px; height: 34px; color: var(--color-text-muted); cursor: pointer; font-size: 16px; flex-shrink: 0; }

  .storage-warning { max-width: 480px; margin: 16px auto 0; padding: 10px 14px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; font-size: 13px; border-radius: var(--radius); line-height: 1.4; }
  .list-error { max-width: 480px; margin: 0 auto 12px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; color: var(--color-negative); font-size: 13px; border-radius: var(--radius); }
  .list-notice { max-width: 480px; margin: 0 auto 12px; padding: 10px 14px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 13px; border-radius: var(--radius); }

  .export-reminder { max-width: 480px; margin: 16px auto 0; padding: 12px 14px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; font-size: 13px; border-radius: var(--radius); line-height: 1.5; }
  .export-reminder-actions { display: flex; gap: 8px; margin-top: 10px; }
  .export-reminder-actions button { border: none; border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .er-export-btn { background: var(--color-text); color: #fff; }
  .er-dismiss-btn { background: #e5e7eb; color: #374151; }

  .entries-list { flex: 1; max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; padding-bottom: 100px; }
  .empty-state { text-align: center; color: var(--color-text-muted); font-size: 14px; margin-top: 64px; padding: 0 24px; }
  .entry { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; }
  .entry-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .entry-row.clickable { cursor: pointer; }
  .entry-info { min-width: 0; flex: 1; }
  .entry-note { font-size: 14px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .entry-date { font-size: 12px; color: var(--color-text-muted); margin: 2px 0 0; display: flex; align-items: center; }
  .expand-chevron { display: inline-block; transition: transform 0.15s; margin-left: 3px; font-style: normal; }
  .expand-chevron.expanded { transform: rotate(90deg); }
  .group-icon { color: var(--color-text-muted); flex-shrink: 0; display: inline-flex; }
  .entry-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .entry-amount { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .entry-amount.positive { color: var(--color-positive); }
  .icon-btn { background: none; border: none; padding: 4px; cursor: pointer; color: #d4d4d4; display: flex; }
  .icon-btn:hover { color: var(--color-text-muted); }
  .receipt-indicator { background: none; border: none; color: var(--color-text-muted); padding: 2px; cursor: pointer; flex-shrink: 0; display: flex; }
  .entry-items-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border); }
  .entry-item-detail-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-muted); padding: 3px 0; gap: 12px; }
  .entry-item-detail-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-item-detail-row span:last-child { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .confirm-row { display: flex; align-items: center; justify-content: space-between; }
  .confirm-text { font-size: 14px; color: var(--color-text-muted); }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-btn { border: none; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; }
  .confirm-yes { background: #fef2f2; color: var(--color-negative); }
  .confirm-no { background: #f5f5f5; color: var(--color-text-muted); }

  .bottom-bar-outer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-surface); border-top: 1px solid var(--color-border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 15; }
  .bottom-bar { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; }
  .btn { border: none; border-radius: var(--radius); padding: 13px 16px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-primary { flex: 1; background: var(--color-text); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-export { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-muted); display: flex; align-items: center; justify-content: center; }
  .btn-export:disabled { opacity: 0.35; cursor: default; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.32); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  @media (min-width: 640px) { .overlay { align-items: center; } }
  .modal { background: var(--color-surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .modal { border-radius: var(--radius-lg); padding-bottom: 20px; } }

  .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-btn { flex: 1; border: none; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; background: #f5f5f5; color: var(--color-text-muted); font-family: inherit; }
  .toggle-btn.active-add { background: var(--color-positive); color: #fff; }
  .toggle-btn.active-subtract { background: var(--color-text); color: #fff; }

  .field-label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
  /* Alle Eingabefelder mindestens 16px Schrift - unter 16px zoomt iOS Safari
     beim Antippen automatisch hinein. Das war die Ursache für praktisch alle
     gemeldeten Zoom-Probleme. */
  .field-input { width: 100%; border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px; font-size: 16px; margin-bottom: 14px; font-family: inherit; }
  .field-input:focus { outline: none; border-color: #a3a3a3; }
  #amountInput { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }

  .mode-switch-link { background: none; border: none; color: var(--color-text-muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; margin: -6px 0 16px; display: block; font-family: inherit; }

  .photo-attach-link { background: none; border: none; color: var(--color-text-muted); font-size: 13px; cursor: pointer; padding: 0; margin: 0 0 14px; display: flex; align-items: center; gap: 5px; font-family: inherit; }
  .photo-attach-link.has-photo { color: var(--color-positive); }
  .photo-preview-row { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; }
  .photo-preview-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--color-border); }
  .photo-remove-btn { background: #f5f5f5; border: none; border-radius: 8px; width: 26px; height: 26px; color: var(--color-text-muted); cursor: pointer; font-size: 15px; line-height: 1; flex-shrink: 0; }

  .items-list { margin-bottom: 8px; }
  .item-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .item-label-input, .item-price-input { border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; font-size: 16px; font-family: inherit; }
  .item-label-input { flex: 1; min-width: 0; }
  .item-price-input { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  .item-remove-btn { background: none; border: none; color: #d4d4d4; cursor: pointer; padding: 4px; flex-shrink: 0; display: flex; }
  .add-item-btn { background: none; border: 1px dashed var(--color-border); border-radius: 8px; padding: 8px; width: 100%; color: var(--color-text-muted); font-size: 13px; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
  .items-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--color-text-muted); margin-bottom: 16px; padding-top: 8px; border-top: 1px solid var(--color-border); }
  .items-total strong { color: var(--color-text); font-variant-numeric: tabular-nums; font-size: 15px; }

  .error-text { font-size: 12px; color: var(--color-negative); margin: -8px 0 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-cancel { flex: 1; background: #f5f5f5; color: #525252; }
  .btn-save { flex: 1; background: var(--color-text); color: #fff; }

  .photo-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .photo-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox-close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <header class="balance-header">
    <button id="importBtn" class="corner-btn corner-btn-left" type="button" aria-label="Einträge aus CSV importieren">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>
    </button>
    <button id="searchToggleBtn" class="corner-btn corner-btn-right" type="button" aria-label="Suchen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <p class="balance-label">Aktueller Saldo</p>
    <p class="balance-amount" id="balanceAmount">0,00 €</p>
    <p class="balance-subtext" id="balanceSubtext">ausgeglichen</p>
  </header>


  <div id="searchBar" class="search-bar" hidden>
    <input type="text" id="searchInput" placeholder="Notiz oder Position suchen ...">
    <button id="clearSearchBtn" class="search-clear-btn" type="button" aria-label="Suche schließen">×</button>
  </div>

  <input type="file" accept=".csv,text/csv" id="csvImportInput" hidden>

  <div id="exportReminder" class="export-reminder" hidden>
    <span id="exportReminderText"></span>
    <div class="export-reminder-actions">
      <button id="erExportBtn" class="er-export-btn" type="button">Jetzt exportieren</button>
      <button id="erDismissBtn" class="er-dismiss-btn" type="button">Später</button>
    </div>
  </div>

  <main class="entries-list">
    <p id="listError" class="list-error" hidden></p>
    <p id="listNotice" class="list-notice" hidden></p>
    <p id="storageWarning" class="storage-warning" hidden></p>
    <div id="entriesContainer"></div>
  </main>

  <div class="bottom-bar-outer">
    <div class="bottom-bar">
      <button id="newEntryBtn" class="btn btn-primary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Neuer Eintrag
      </button>
      <button id="exportBtn" class="btn btn-export" type="button" aria-label="Einträge exportieren">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
    </div>
  </div>

  <div id="formOverlay" class="overlay" hidden>
    <div class="modal">
      <div class="type-toggle">
        <button id="typeAddBtn" class="toggle-btn" type="button">Einnahme (+)</button>
        <button id="typeSubtractBtn" class="toggle-btn active-subtract" type="button">Ausgabe (−)</button>
      </div>
      <div id="singleModeFields">
        <label class="field-label" for="amountInput">Betrag (€)</label>
        <input class="field-input" type="text" inputmode="decimal" id="amountInput" placeholder="0,00">
        <label class="field-label" for="noteInput">Notiz</label>
        <input class="field-input" type="text" id="noteInput" placeholder="z.B. Supermarkt, Tanken ...">
        <button class="mode-switch-link" id="switchToGroupBtn" type="button">Mehrere Posten statt einem Betrag?</button>
      </div>
      <div id="groupModeFields" hidden>
        <label class="field-label" for="headingInput">Überschrift</label>
        <input class="field-input" type="text" id="headingInput" placeholder="z.B. Fahrradteile" style="margin-bottom: 10px;">
        <label class="field-label">Posten</label>
        <div class="items-list" id="itemsList"></div>
        <button class="add-item-btn" id="addItemBtn" type="button">+ Position hinzufügen</button>
        <div class="items-total"><span>Gesamt</span><strong id="itemsTotalDisplay">0,00 €</strong></div>
        <button class="mode-switch-link" id="switchToSingleBtn" type="button">Einzelbetrag stattdessen?</button>
      </div>
      <button class="photo-attach-link" id="photoBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span id="photoBtnLabel">Beleg fotografieren</span>
      </button>
      <div id="photoPreview" class="photo-preview-row" hidden></div>
      <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
      <p id="formError" class="error-text" hidden></p>
      <div class="modal-actions">
        <button id="cancelBtn" class="btn btn-cancel" type="button">Abbrechen</button>
        <button id="saveBtn" class="btn btn-save" type="button"><span id="saveBtnText">Speichern</span></button>
      </div>
    </div>
  </div>

  <div id="photoLightbox" class="photo-lightbox" hidden>
    <button id="closeLightboxBtn" class="lightbox-close" type="button" aria-label="Schließen">×</button>
    <img id="lightboxImg" alt="Beleg">
  </div>

</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "geldverrechnung_entries";
  const LAST_EXPORT_KEY = "geldverrechnung_last_export";

  function isStorageAvailable() {
    try {
      const testKey = "__storage_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return true;
    } catch (e) { return false; }
  }
  const storageAvailable = isStorageAvailable();

  function loadEntries() {
    if (!storageAvailable) return [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveEntries(list) {
    if (!storageAvailable) return true;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
  }

  let entries = loadEntries();
  let confirmingDeleteId = null;
  let expandedGroupId = null;
  let editingEntryId = null;
  let searchQuery = "";

  function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function toDisplay(cents) {
    const value = cents / 100;
    return value.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function formatAmountForEdit(cents) { return (cents / 100).toFixed(2).replace(".", ","); }
  function parseToCents(input) {
    if (!input) return null;
    const normalized = input.replace(",", ".").trim();
    const value = parseFloat(normalized);
    if (isNaN(value) || value <= 0) return null;
    return Math.round(value * 100);
  }
  function formatDateTime(iso) {
    const d = new Date(iso);
    const date = d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    return `${date}, ${time}`;
  }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function calculateBalance(list) {
    return list.reduce((sum, e) => sum + (e.type === "add" ? e.amount : -e.amount), 0);
  }
  function resizeImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > maxSize || height > maxSize) {
            const ratio = Math.min(maxSize / width, maxSize / height);
            width = Math.round(width * ratio); height = Math.round(height * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => reject(new Error("Bild konnte nicht gelesen werden"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden"));
      reader.readAsDataURL(file);
    });
  }

  const balanceAmountEl = document.getElementById("balanceAmount");
  const balanceSubtextEl = document.getElementById("balanceSubtext");
  const entriesContainerEl = document.getElementById("entriesContainer");
  const storageWarningEl = document.getElementById("storageWarning");
  const listErrorEl = document.getElementById("listError");
  const listNoticeEl = document.getElementById("listNotice");
  const exportBtn = document.getElementById("exportBtn");

  const trashIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`;
  const editIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  const checkIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const xIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  const xIconSmall = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  const cameraIconSmall = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
  const layersIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`;

  // Filtert Einträge anhand der Suchanfrage - Notiz/Überschrift ODER
  // die Bezeichnung einzelner Posten bei einem Mehrere-Posten-Eintrag.
  function matchesSearch(e) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    if ((e.note || "").toLowerCase().includes(q)) return true;
    if (Array.isArray(e.items)) return e.items.some((it) => it.label.toLowerCase().includes(q));
    return false;
  }

  function renderBalance() {
    const balance = calculateBalance(entries);
    balanceAmountEl.textContent = toDisplay(balance);
    balanceAmountEl.classList.toggle("negative", balance < 0);
    balanceSubtextEl.textContent = balance > 0 ? "noch verfügbar" : balance < 0 ? "mehr ausgelegt als erhalten" : "ausgeglichen";
  }

  function renderEntries() {
    const filtered = entries.filter(matchesSearch);
    if (entries.length === 0) {
      entriesContainerEl.innerHTML = '<p class="empty-state">Noch keine Einträge. Leg mit dem ersten überwiesenen Betrag los.</p>';
      exportBtn.disabled = true;
      return;
    }
    exportBtn.disabled = false;
    if (filtered.length === 0) {
      entriesContainerEl.innerHTML = `<p class="empty-state">Keine Treffer für "${escapeHtml(searchQuery)}".</p>`;
      return;
    }
    const sorted = filtered.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    entriesContainerEl.innerHTML = sorted.map((e) => {
      if (e.id === confirmingDeleteId) {
        return `<div class="entry"><div class="confirm-row">
          <span class="confirm-text">Diesen Eintrag löschen?</span>
          <div class="confirm-actions">
            <button class="confirm-btn confirm-yes" data-id="${e.id}" type="button" aria-label="Löschen bestätigen">${checkIcon}</button>
            <button class="confirm-btn confirm-no" data-id="${e.id}" type="button" aria-label="Abbrechen">${xIcon}</button>
          </div></div></div>`;
      }
      const sign = e.type === "add" ? "+" : "−";
      const amountClass = e.type === "add" ? "entry-amount positive" : "entry-amount";
      const isGroup = Array.isArray(e.items) && e.items.length > 0;
      const isExpanded = e.id === expandedGroupId;
      const photoIndicator = e.photo
        ? `<button class="receipt-indicator" data-photo-id="${e.id}" type="button" aria-label="Beleg ansehen">${cameraIconSmall}</button>` : "";
      let titleHtml, subtitleHtml, detailHtml = "";
      if (isGroup) {
        titleHtml = `<span class="group-icon">${layersIcon}</span><span>${escapeHtml(e.note)}</span>`;
        subtitleHtml = `${e.items.length} Posten · ${formatDateTime(e.timestamp)} <span class="expand-chevron${isExpanded ? " expanded" : ""}">›</span>`;
        if (isExpanded) {
          detailHtml = `<div class="entry-items-detail">` +
            e.items.map((it) => `<div class="entry-item-detail-row"><span>${escapeHtml(it.label)}</span><span>${toDisplay(it.amount)}</span></div>`).join("") +
            `</div>`;
        }
      } else {
        titleHtml = escapeHtml(e.note || "(ohne Notiz)");
        subtitleHtml = formatDateTime(e.timestamp);
      }
      return `<div class="entry" data-id="${e.id}">
        <div class="entry-row${isGroup ? " clickable" : ""}" ${isGroup ? `data-group-toggle="${e.id}"` : ""}>
          <div class="entry-info">
            <p class="entry-note">${titleHtml}</p>
            <p class="entry-date">${subtitleHtml}</p>
          </div>
          <div class="entry-right">
            ${photoIndicator}
            <span class="${amountClass}">${sign} ${toDisplay(e.amount)}</span>
            <button class="icon-btn edit-btn" data-id="${e.id}" type="button" aria-label="Eintrag bearbeiten">${editIcon}</button>
            <button class="icon-btn delete-btn" data-id="${e.id}" type="button" aria-label="Eintrag löschen">${trashIcon}</button>
          </div>
        </div>
        ${detailHtml}
      </div>`;
    }).join("");
  }

  function renderAll() { renderBalance(); renderEntries(); }

  if (!storageAvailable) {
    storageWarningEl.hidden = false;
    storageWarningEl.textContent = "Speicherung ist in dieser Vorschau nicht verfügbar – Änderungen bleiben nur bis zum Schließen erhalten. Lade die Datei herunter und öffne sie in deinem Browser, damit alles dauerhaft gespeichert wird.";
  }
  renderAll();

  // --- Suche ------------------------------------------------------------
  const searchToggleBtn = document.getElementById("searchToggleBtn");
  const searchBar = document.getElementById("searchBar");
  const searchInput = document.getElementById("searchInput");
  const clearSearchBtn = document.getElementById("clearSearchBtn");

  searchToggleBtn.addEventListener("click", () => {
    const willShow = searchBar.hidden;
    searchBar.hidden = !willShow;
    searchToggleBtn.classList.toggle("active", willShow);
    if (willShow) { searchInput.focus(); }
    else { searchQuery = ""; searchInput.value = ""; renderEntries(); }
  });
  searchInput.addEventListener("input", () => { searchQuery = searchInput.value.trim(); renderEntries(); });
  clearSearchBtn.addEventListener("click", () => {
    searchQuery = ""; searchInput.value = ""; searchBar.hidden = true;
    searchToggleBtn.classList.remove("active"); renderEntries();
  });

  // --- Formular ------------------------------------------------------------
  const formOverlay = document.getElementById("formOverlay");
  const typeAddBtn = document.getElementById("typeAddBtn");
  const typeSubtractBtn = document.getElementById("typeSubtractBtn");
  const amountInput = document.getElementById("amountInput");
  const noteInput = document.getElementById("noteInput");
  const headingInput = document.getElementById("headingInput");
  const formError = document.getElementById("formError");
  const saveBtn = document.getElementById("saveBtn");
  const saveBtnText = document.getElementById("saveBtnText");
  const cancelBtn = document.getElementById("cancelBtn");
  const newEntryBtn = document.getElementById("newEntryBtn");
  const singleModeFields = document.getElementById("singleModeFields");
  const groupModeFields = document.getElementById("groupModeFields");
  const switchToGroupBtn = document.getElementById("switchToGroupBtn");
  const switchToSingleBtn = document.getElementById("switchToSingleBtn");
  const itemsListEl = document.getElementById("itemsList");
  const addItemBtn = document.getElementById("addItemBtn");
  const itemsTotalDisplay = document.getElementById("itemsTotalDisplay");
  const photoBtn = document.getElementById("photoBtn");
  const photoBtnLabel = document.getElementById("photoBtnLabel");
  const photoInput = document.getElementById("photoInput");
  const photoPreview = document.getElementById("photoPreview");

  let currentType = "subtract";
  let currentMode = "single";
  let pendingPhoto = null;

  // Verhindert, dass die Bildschirmtastatur verschwindet, wenn man bei
  // offener Tastatur auf Einnahme/Ausgabe tippt: ohne das hier würde der
  // Browser dem Betrags-/Notizfeld den Fokus (und damit die Tastatur) sofort
  // entziehen, sobald ein anderes Element angetippt wird.
  [typeAddBtn, typeSubtractBtn].forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => e.preventDefault());
  });

  function updateTypeButtons() {
    typeAddBtn.classList.toggle("active-add", currentType === "add");
    typeSubtractBtn.classList.toggle("active-subtract", currentType === "subtract");
  }
  function setMode(mode) {
    currentMode = mode;
    singleModeFields.hidden = mode !== "single";
    groupModeFields.hidden = mode !== "group";
    formError.hidden = true;
  }
  function renderPhotoPreview() {
    if (pendingPhoto) {
      photoPreview.innerHTML = `<img src="${pendingPhoto}" alt="Beleg-Vorschau"><button type="button" class="photo-remove-btn" aria-label="Foto entfernen">×</button>`;
      photoPreview.hidden = false;
      photoBtn.classList.add("has-photo");
      photoBtnLabel.textContent = "Beleg ersetzen";
    } else {
      photoPreview.hidden = true; photoPreview.innerHTML = "";
      photoBtn.classList.remove("has-photo");
      photoBtnLabel.textContent = "Beleg fotografieren";
    }
  }
  function openForm() {
    editingEntryId = null;
    currentType = "subtract"; updateTypeButtons(); setMode("single");
    amountInput.value = ""; noteInput.value = ""; headingInput.value = "";
    itemsListEl.innerHTML = ""; pendingPhoto = null; renderPhotoPreview();
    formError.hidden = true; saveBtnText.textContent = "Speichern";
    formOverlay.hidden = false; amountInput.focus();
  }
  function openFormForEdit(entry) {
    editingEntryId = entry.id;
    currentType = entry.type; updateTypeButtons();
    pendingPhoto = entry.photo || null; renderPhotoPreview();
    formError.hidden = true;
    if (Array.isArray(entry.items) && entry.items.length > 0) {
      setMode("group");
      headingInput.value = entry.note || "";
      amountInput.value = ""; noteInput.value = ""; itemsListEl.innerHTML = "";
      entry.items.forEach((it) => addItemRow(it.label, it.amount));
    } else {
      setMode("single");
      amountInput.value = formatAmountForEdit(entry.amount);
      noteInput.value = entry.note || "";
      headingInput.value = ""; itemsListEl.innerHTML = "";
    }
    saveBtnText.textContent = "Änderungen speichern";
    formOverlay.hidden = false;
  }
  function closeForm() { formOverlay.hidden = true; }

  typeAddBtn.addEventListener("click", () => { currentType = "add"; updateTypeButtons(); });
  typeSubtractBtn.addEventListener("click", () => { currentType = "subtract"; updateTypeButtons(); });
  switchToGroupBtn.addEventListener("click", () => { setMode("group"); if (itemsListEl.children.length === 0) addItemRow(); });
  switchToSingleBtn.addEventListener("click", () => setMode("single"));

  function restrictAmountInput(el) {
    const value = el.value;
    if (value !== "" && !/^\d*[.,]?\d{0,2}$/.test(value)) el.value = value.slice(0, -1);
  }
  amountInput.addEventListener("input", () => restrictAmountInput(amountInput));

  newEntryBtn.addEventListener("click", openForm);
  cancelBtn.addEventListener("click", closeForm);
  formOverlay.addEventListener("click", (e) => { if (e.target === formOverlay) closeForm(); });

  function createItemRow() {
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = '<input type="text" class="item-label-input" placeholder="Bezeichnung">' +
      '<input type="text" inputmode="decimal" class="item-price-input" placeholder="0,00">' +
      `<button type="button" class="item-remove-btn" aria-label="Position entfernen">${xIconSmall}</button>`;
    return row;
  }
  // Wichtig: addItemRow() wird sowohl vom Button (ohne Argumente) als auch
  // beim Bearbeiten (mit Label/Betrag) aufgerufen. Der Button ruft die
  // Funktion jetzt über eine kleine Pfeilfunktion auf, statt sie direkt als
  // Event-Handler zu verwenden - sonst würde ihr das Klick-Event selbst als
  // "initialLabel" übergeben (sichtbar als "[object PointerEvent]" und "NaN").
  function addItemRow(initialLabel, initialAmountCents) {
    const row = createItemRow();
    itemsListEl.appendChild(row);
    if (initialLabel !== undefined) {
      row.querySelector(".item-label-input").value = initialLabel;
      row.querySelector(".item-price-input").value = formatAmountForEdit(initialAmountCents);
    } else {
      row.querySelector(".item-label-input").focus();
    }
    updateItemsTotal();
  }
  function updateItemsTotal() {
    const rows = itemsListEl.querySelectorAll(".item-row");
    let total = 0;
    rows.forEach((row) => {
      const cents = parseToCents(row.querySelector(".item-price-input").value);
      if (cents !== null) total += cents;
    });
    itemsTotalDisplay.textContent = toDisplay(total);
  }
  function collectGroupItems() {
    const rows = itemsListEl.querySelectorAll(".item-row");
    const items = [];
    rows.forEach((row) => {
      const label = row.querySelector(".item-label-input").value.trim();
      const cents = parseToCents(row.querySelector(".item-price-input").value);
      if (label && cents !== null) items.push({ label, amount: cents });
    });
    return items;
  }
  addItemBtn.addEventListener("click", () => addItemRow());
  itemsListEl.addEventListener("click", (e) => {
    const removeBtn = e.target.closest(".item-remove-btn");
    if (removeBtn) { removeBtn.closest(".item-row").remove(); updateItemsTotal(); }
  });
  itemsListEl.addEventListener("input", (e) => {
    if (e.target.classList.contains("item-price-input")) { restrictAmountInput(e.target); updateItemsTotal(); }
  });

  photoBtn.addEventListener("click", () => { photoInput.value = ""; photoInput.click(); });
  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if (!file) return;
    try { pendingPhoto = await resizeImage(file, 1200, 0.7); renderPhotoPreview(); }
    catch (err) { formError.textContent = "Foto konnte nicht verarbeitet werden. Bitte nochmal versuchen."; formError.hidden = false; }
  });
  photoPreview.addEventListener("click", (e) => {
    if (e.target.closest(".photo-remove-btn")) { pendingPhoto = null; renderPhotoPreview(); }
  });

  function persistEntries(newEntries) {
    if (!saveEntries(newEntries)) {
      formError.textContent = "Speichern fehlgeschlagen - möglicherweise ist der Speicherplatz voll (z.B. durch viele Belegfotos). Bitte nochmal versuchen oder erst einen alten Beleg löschen.";
      formError.hidden = false;
      return false;
    }
    entries = newEntries;
    return true;
  }

  saveBtn.addEventListener("click", () => {
    let entryData;
    if (currentMode === "single") {
      const cents = parseToCents(amountInput.value);
      if (cents === null) { formError.textContent = "Bitte einen Betrag größer als 0 eingeben."; formError.hidden = false; return; }
      entryData = { type: currentType, amount: cents, note: noteInput.value.trim() };
    } else {
      const heading = headingInput.value.trim();
      if (!heading) { formError.textContent = "Bitte eine Überschrift eingeben."; formError.hidden = false; return; }
      const items = collectGroupItems();
      if (items.length === 0) { formError.textContent = "Bitte mindestens einen Posten mit Bezeichnung und Preis eingeben."; formError.hidden = false; return; }
      entryData = { type: currentType, amount: items.reduce((sum, it) => sum + it.amount, 0), note: heading, items: items };
    }
    if (pendingPhoto) entryData.photo = pendingPhoto;

    let newEntries;
    if (editingEntryId) {
      const original = entries.find((en) => en.id === editingEntryId);
      const updatedEntry = Object.assign({ id: editingEntryId, timestamp: original.timestamp }, entryData);
      newEntries = entries.map((en) => (en.id === editingEntryId ? updatedEntry : en));
    } else {
      const newEntry = Object.assign({ id: generateId(), timestamp: new Date().toISOString() }, entryData);
      newEntries = entries.concat([newEntry]);
    }
    if (!persistEntries(newEntries)) return;
    renderAll();
    closeForm();
    // Nach dem Speichern nach oben scrollen - der neue/geänderte Eintrag
    // steht (weil neueste zuerst sortiert wird) ganz oben in der Liste.
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  entriesContainerEl.addEventListener("click", (e) => {
    const editBtn = e.target.closest(".edit-btn");
    if (editBtn) { const entry = entries.find((en) => en.id === editBtn.dataset.id); if (entry) openFormForEdit(entry); return; }
    const deleteBtn = e.target.closest(".delete-btn");
    if (deleteBtn) { confirmingDeleteId = deleteBtn.dataset.id; renderEntries(); return; }
    const yesBtn = e.target.closest(".confirm-yes");
    if (yesBtn) {
      const id = yesBtn.dataset.id;
      const newEntries = entries.filter((entry) => entry.id !== id);
      if (!saveEntries(newEntries)) { listErrorEl.textContent = "Löschen fehlgeschlagen. Bitte nochmal versuchen."; listErrorEl.hidden = false; return; }
      listErrorEl.hidden = true; entries = newEntries; confirmingDeleteId = null;
      if (expandedGroupId === id) expandedGroupId = null;
      renderAll(); return;
    }
    const noBtn = e.target.closest(".confirm-no");
    if (noBtn) { confirmingDeleteId = null; renderEntries(); return; }
    const receiptBtn = e.target.closest(".receipt-indicator");
    if (receiptBtn) {
      const entry = entries.find((en) => en.id === receiptBtn.dataset.photoId);
      if (entry && entry.photo) openLightbox(entry.photo);
      return;
    }
    const groupToggle = e.target.closest("[data-group-toggle]");
    if (groupToggle) {
      const id = groupToggle.dataset.groupToggle;
      expandedGroupId = expandedGroupId === id ? null : id;
      renderEntries();
    }
  });

  const photoLightbox = document.getElementById("photoLightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const closeLightboxBtn = document.getElementById("closeLightboxBtn");
  function openLightbox(dataUrl) { lightboxImg.src = dataUrl; photoLightbox.hidden = false; }
  function closeLightbox() { photoLightbox.hidden = true; lightboxImg.src = ""; }
  closeLightboxBtn.addEventListener("click", closeLightbox);
  photoLightbox.addEventListener("click", (e) => { if (e.target === photoLightbox) closeLightbox(); });

  // --- Export als CSV (chronologisch, mit laufendem Saldo) -------------------
  function buildCsv() {
    const chronological = entries.slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    let running = 0;
    const rows = chronological.map((e) => {
      running += e.type === "add" ? e.amount : -e.amount;
      const sign = e.type === "add" ? "+" : "-";
      const betrag = sign + (e.amount / 100).toFixed(2).replace(".", ",");
      const saldo = (running / 100).toFixed(2).replace(".", ",");
      let note = e.note || "";
      if (Array.isArray(e.items) && e.items.length > 0) {
        const breakdown = e.items.map((it) => `${it.label}: ${(it.amount / 100).toFixed(2).replace(".", ",")}`).join("; ");
        note = `${note} (${breakdown})`;
      }
      note = note.replace(/"/g, '""');
      const beleg = e.photo ? "Ja" : "";
      return `"${formatDateTime(e.timestamp)}";"${e.type === "add" ? "Einnahme" : "Ausgabe"}";"${betrag}";"${note}";"${saldo}";"${beleg}"`;
    });
    const header = '"Datum";"Typ";"Betrag (EUR)";"Notiz";"Saldo (EUR)";"Beleg"';
    return "\uFEFF" + [header].concat(rows).join("\r\n");
  }

  function doExport() {
    const csvContent = buildCsv();
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Geldverrechnung_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    try { localStorage.setItem(LAST_EXPORT_KEY, String(Date.now())); } catch (e) {}
    exportReminderEl.hidden = true;
  }

  exportBtn.addEventListener("click", () => { if (entries.length > 0) doExport(); });

  // --- CSV-Import (Wiederherstellung aus einer exportierten Datei) -----------
  // Hinweis zur Genauigkeit: Bei Mehrere-Posten-Einträgen wird beim Export
  // die Aufschlüsselung in Klammern in die Notiz geschrieben. Beim Import
  // wird das bewusst NICHT wieder in einzelne Posten zurückverwandelt,
  // sondern als normale Notiz übernommen - Betrag und Datum bleiben exakt
  // erhalten, nur die Posten-Struktur selbst geht dabei verloren.
  function parseCsvLine(line) {
    const fields = [];
    let current = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (inQuotes) {
        if (char === '"') { if (line[i + 1] === '"') { current += '"'; i++; } else { inQuotes = false; } }
        else { current += char; }
      } else {
        if (char === '"') inQuotes = true;
        else if (char === ";") { fields.push(current); current = ""; }
        else current += char;
      }
    }
    fields.push(current);
    return fields;
  }
  function parseGermanAmountToCents(str) {
    const cleaned = (str || "").replace(/[+\-]/g, "").replace(",", ".").trim();
    const value = parseFloat(cleaned);
    if (isNaN(value)) return null;
    return Math.round(Math.abs(value) * 100);
  }
  function parseGermanDateTimeToIso(str) {
    const match = (str || "").match(/(\d{2})\.(\d{2})\.(\d{4}),?\s*(\d{2}):(\d{2})/);
    if (!match) return new Date().toISOString();
    const [, day, month, year, hour, minute] = match;
    return new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute)).toISOString();
  }
  function parseCsvImport(text) {
    const withoutBom = text.replace(/^\uFEFF/, "");
    const lines = withoutBom.split(/\r\n|\n/).filter((l) => l.trim() !== "");
    if (lines.length < 2) return [];
    const imported = [];
    lines.slice(1).forEach((line) => {
      const fields = parseCsvLine(line);
      if (fields.length < 4) return;
      const [datum, typ, betrag, notiz] = fields;
      const cents = parseGermanAmountToCents(betrag);
      if (cents === null || cents === 0) return;
      imported.push({
        id: generateId(),
        type: (typ || "").trim() === "Einnahme" ? "add" : "subtract",
        amount: cents,
        note: notiz || "",
        timestamp: parseGermanDateTimeToIso(datum)
      });
    });
    return imported;
  }

  const csvImportInput = document.getElementById("csvImportInput");
  const importBtn = document.getElementById("importBtn");
  importBtn.addEventListener("click", () => { csvImportInput.value = ""; csvImportInput.click(); });
  csvImportInput.addEventListener("change", () => {
    const file = csvImportInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const imported = parseCsvImport(String(reader.result));
      if (imported.length === 0) {
        listErrorEl.textContent = "Es konnten keine Einträge aus dieser Datei gelesen werden.";
        listErrorEl.hidden = false;
        return;
      }
      const newEntries = entries.concat(imported);
      if (!saveEntries(newEntries)) {
        listErrorEl.textContent = "Import fehlgeschlagen - möglicherweise ist der Speicherplatz voll.";
        listErrorEl.hidden = false;
        return;
      }
      entries = newEntries;
      listErrorEl.hidden = true;
      listNoticeEl.textContent = `${imported.length} Einträge importiert (zu den bestehenden hinzugefügt, nichts wurde ersetzt).`;
      listNoticeEl.hidden = false;
      renderAll();
    };
    reader.readAsText(file, "UTF-8");
  });

  // --- Erinnerung ans Exportieren (kein automatischer Hintergrund-Export
  // möglich - iOS Safari erlaubt das für Web-Apps nicht; das hier prüft
  // stattdessen bei jedem Öffnen, ob es Zeit für ein manuelles Backup ist). --
  const exportReminderEl = document.getElementById("exportReminder");
  const exportReminderText = document.getElementById("exportReminderText");
  const erExportBtn = document.getElementById("erExportBtn");
  const erDismissBtn = document.getElementById("erDismissBtn");

  function checkExportReminder() {
    if (entries.length === 0) return;
    let last = null;
    try { last = localStorage.getItem(LAST_EXPORT_KEY); } catch (e) {}
    const daysSince = last ? (Date.now() - Number(last)) / (1000 * 60 * 60 * 24) : Infinity;
    if (daysSince >= 7) {
      exportReminderText.textContent = last
        ? "Dein letztes Backup ist über eine Woche her. Kurz eine aktuelle Sicherung herunterladen?"
        : "Noch kein Backup erstellt. Kurz eine Sicherung als CSV herunterladen?";
      exportReminderEl.hidden = false;
    }
  }
  erExportBtn.addEventListener("click", doExport);
  erDismissBtn.addEventListener("click", () => { exportReminderEl.hidden = true; });
  checkExportReminder();

})();
</script>
</body>
</html>
